[package]
name = "anpr-wiegand"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Lorent Lempereur <lorent.lempereur.dev@gmail.com>"]
description = "Format license plates to the Wiegand format (26-bit and 64-bit) for ANPR systems"
license = "MIT"
repository = "https://github.com/looorent/anpr-wiegand-rs"
homepage = "https://github.com/looorent/anpr-wiegand-rs"
documentation = "https://docs.rs/anpr-wiegand"
readme = "README.md"
keywords = ["anpr", "wiegand", "license-plate", "access-control", "no-std"]
categories = ["encoding", "no-std", "embedded"]
include = ["src/**/*", "tests/**/*", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
